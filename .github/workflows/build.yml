name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check version metadata
        shell: pwsh
        run: |
          node -e "const p=require('./package.json'),l=require('./package-lock.json'),r=require('./release/version.json');if(l.version!==p.version||l.packages[''].version!==p.version||r.version!==p.version)throw new Error('Version metadata differs')"
      - run: npx tsc --noEmit
      - run: npm run test:shortcuts
      - run: npm run test:library
      - run: npm run test:playback-metadata
      - run: npm run build:release
      - name: Generate build metadata
        shell: pwsh
        run: |
          node -e "const fs=require('fs'),version=require('./package.json').version;fs.writeFileSync('out/build-meta.json',JSON.stringify({version,tag:'v'+version.replace(/\.0$/,''),branch:process.env.GITHUB_REF_NAME,commit:process.env.GITHUB_SHA},null,2))"
      - uses: actions/upload-artifact@v4
        with:
          name: build-meta
          path: out/build-meta.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: MusicFree-windows-x64
          path: |
            release/MusicFree-*-win-x64.exe
            release/MusicFree-*-win-x64.zip
            release/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 30
