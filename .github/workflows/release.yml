name: Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Build workflow run ID
        required: true
        type: string
      release_notes:
        description: Optional notes replacing release/version.json changeLog
        required: false
        type: string

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download a successful Build run
        env:
          BUILD_RUN_ID: ${{ inputs.run_id }}
        run: |
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh run view "$BUILD_RUN_ID" --json name,conclusion > run.json
          jq -e '.name == "Build" and .conclusion == "success"' run.json
          gh run download "$BUILD_RUN_ID" --dir artifacts
      - name: Read build metadata
        id: meta
        run: |
          META_FILE=artifacts/build-meta/build-meta.json
          VERSION=$(jq -er '.version' "$META_FILE")
          TAG=$(jq -er '.tag' "$META_FILE")
          COMMIT=$(jq -er '.commit' "$META_FILE")
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$TAG" == "v$VERSION" ]] || exit 1
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.commit }}
          path: source
      - name: Collect and verify release assets
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          mkdir release-assets
          cp "artifacts/MusicFree-windows-x64/MusicFree-$RELEASE_TAG-win-x64.exe" release-assets/
          cp "artifacts/MusicFree-windows-x64/MusicFree-$RELEASE_TAG-win-x64.zip" release-assets/
          cp "artifacts/MusicFree-windows-x64/SHA256SUMS-$RELEASE_TAG.txt" release-assets/
          cd release-assets
          sha256sum --check "SHA256SUMS-$RELEASE_TAG.txt"
      - name: Generate release notes from the built revision
        env:
          NOTES_INPUT: ${{ inputs.release_notes }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          jq -e --arg v "$RELEASE_VERSION" '.version == $v' source/release/version.json
          if [ -n "$NOTES_INPUT" ]; then
            printf '%s\n' "$NOTES_INPUT" > release-notes.md
          else
            jq -r '.changeLog | join("\n")' source/release/version.json > release-notes.md
          fi
      - name: Create draft release
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          SOURCE_COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Tag already exists: $RELEASE_TAG"
            exit 1
          fi
          flags=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --target "$SOURCE_COMMIT" \
            --title "MusicFree $RELEASE_VERSION" --notes-file release-notes.md \
            --draft "${flags[@]}" release-assets/*
