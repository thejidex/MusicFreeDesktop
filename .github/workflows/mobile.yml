name: Mobile

on:
  workflow_dispatch:
  push:
    branches: ['codex/mobile-release-1-4']
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml']

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run test:library
      - run: npm run test:runtime
      - name: Build native Android app (unsigned verification artifact)
        run: |
          node scripts/collect-notices.cjs
          # Use the official distribution on GitHub runners; the upstream mirror can time out abroad.
          python3 - <<'PY'
          from pathlib import Path
          file = Path('android/gradle/wrapper/gradle-wrapper.properties')
          text = file.read_text().replace('mirrors.cloud.tencent.com/gradle/', 'services.gradle.org/distributions/').replace('networkTimeout=10000', 'networkTimeout=60000')
          file.write_text(text)
          PY
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: MusicFree-android-unsigned-validation
          path: mobile/android/app/build/outputs/apk/release/*unsigned.apk
          if-no-files-found: error

  ios:
    runs-on: macos-14
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: mobile
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - name: Archive device app and package unsigned IPA
        run: npm run build:ios
      - name: Launch the iOS simulator app
        run: bash scripts/smoke-ios.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MusicFree-ios-smoke
          path: mobile/out/ios/smoke
      - name: Record source revision
        run: |
          node -e "require('fs').writeFileSync('../release/mobile-build.json', JSON.stringify({version:require('./package.json').version.split('.').slice(0,2).join('.'),commit:process.env.GITHUB_SHA,signed:false},null,2))"
      - uses: actions/upload-artifact@v4
        with:
          name: MusicFree-ios-unsigned
          path: |
            release/*-ios-unsigned.ipa
            release/SHA256SUMS-*-ios.txt
            release/mobile-build.json
          if-no-files-found: error
